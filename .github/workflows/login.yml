name: Auto-login-Lunes

on:
  workflow_dispatch:            # 手动触发
  schedule:
    # ⚠️ cron 只认 UTC：北京时间 = UTC + 8
    # 当前：每月 5/15/25 日 UTC 06:04 = 北京时间 14:04，间隔均匀约 10 天
    - cron: '4 6 5,15,25 * *'

jobs:
  Renew-lunes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write           # time.txt 提交推送需要
      actions: write            # gh run delete 清理记录需要
    steps:
      - name: 📥 下载代码
        uses: actions/checkout@v6

      - name: 🐍 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 🛠️ 安装系统依赖和Python依赖
        run: |
          sudo apt-get update
          sudo apt-get install xvfb x11-utils xdotool scrot fonts-noto-cjk -y
          pip install seleniumbase aiohttp requests
          seleniumbase install chromedriver

      # 🆕 修改：原「设置sing-box代理转发」步骤改为只下载安装脚本。
      # 真正的 sing-box 启动改由 app.py 按账号逐节点调用本脚本完成：
      #   NODE_LINK 第1行 → 账号1，第2行 → 账号2；仅1行则共用；为空则直连。
      - name: 📥 下载 sing-box 安装脚本
        run: wget -qO setup_proxy.sh https://main.ssss.nyc.mn/setup_proxy.sh

      - name: 🚀 运行续期脚本
        env:
          LUNES_EMAIL: ${{ secrets.LUNES_EMAIL }}
          LUNES_PASSWORD: ${{ secrets.LUNES_PASSWORD }}
          LUNES_EMAIL1: ${{ secrets.LUNES_EMAIL1 }}       # 账号2（可选，不配则自动跳过）
          LUNES_PASSWORD1: ${{ secrets.LUNES_PASSWORD1 }} # 账号2 密码
          # 🆕 修改：NODE_LINK 支持多行节点（一行一个），直接在 secret 里换行填写。
          #   2 行 → 账号1 用第1行、账号2 用第2行
          #   1 行 → 账号1、账号2 共用该节点
          #   3 行及以上 → 只取前 2 行，多余忽略
          #   留空/不配置 → 全部直连
          NODE_LINK: ${{ secrets.NODE_LINK }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
          python3 app.py

      # 兜底：清理可能残留的 sing-box 进程
      - name: 🧹 清理 sing-box 进程
        if: always()
        run: pkill -f sing-box || true

      # 更新时间到 time.txt，避免仓库长期无活动导致 schedule 被自动停用
      # （60 天无活动自动禁用只针对 public 仓库；private 仓库无此限制）
      - name: 更新时间
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')" > time.txt
          git add time.txt
          if git diff --cached --quiet; then
            echo "No need to commit"
          else
            git commit -m "⏱️ Auto Update by Github Actions: $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')"
            git pull --rebase origin main || true
            git push origin main
          fi

      - name: 🧹 清理旧的工作流运行记录
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
